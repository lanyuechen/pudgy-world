<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pudgy World</title>
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <div id="loading">
        <div class="panel">
          <p class="title">Pudgy World</p>
          <p class="status" id="loading-status">Loading…</p>
          <div class="bar"><div id="loading-bar"></div></div>
        </div>
      </div>
      <div id="config">
        <button
          type="button"
          id="config-toggle"
          aria-label="Open settings"
          aria-expanded="false"
          aria-controls="config-panel"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path
              fill="currentColor"
              d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.1 7.1 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.6.24-1.14.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.68.22l2.39-.96c.49.39 1.03.7 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.6-.24 1.14-.55 1.63-.94l2.39.96c.25.12.54.02.68-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"
            />
          </svg>
        </button>
        <div id="config-panel" role="dialog" aria-label="Settings" hidden>
          <p class="config-title">Settings</p>
          <label class="config-field" for="scene-select">
            <span class="label">Scene</span>
            <select id="scene-select" aria-label="Select scene"></select>
          </label>
          <div id="traits-panel" class="config-section"></div>
          <div id="hint">WASD move · Shift slide · Space jump · F throw · Click fish · Hold drag look · Scroll zoom</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
