<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="screen-orientation" content="landscape" />
    <title>Pudgy World</title>
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <div id="scene-loading" hidden aria-live="polite" aria-busy="false">
        <div class="scene-loading-panel">
          <p class="scene-loading-status" id="scene-loading-status">加载场景…</p>
        </div>
      </div>
      <div id="loading">
        <div class="panel">
          <p class="title">Pudgy World</p>
          <p class="status" id="loading-status">加载中…</p>
          <div class="bar"><div id="loading-bar"></div></div>
        </div>
      </div>
      <div id="landscape-tip" hidden aria-hidden="true" role="dialog" aria-label="横屏提示">
        <button type="button" id="landscape-tip-btn">
          横屏游戏，以获得更好的体验
        </button>
      </div>
      <div id="config">
        <div class="player-status" id="player-status">
          <button
            type="button"
            id="config-toggle"
            aria-label="打开设置"
            aria-expanded="false"
            aria-controls="config-panel"
          >
            <span class="config-toggle-avatar" aria-hidden="true">
              <canvas id="config-toggle-avatar-canvas" width="40" height="40"></canvas>
            </span>
          </button>
          <div id="player-hp-bar" hidden></div>
        </div>
        <div id="config-panel" role="dialog" aria-label="设置" hidden>
          <div class="config-shell">
            <div class="config-column">
              <nav class="config-nav" aria-label="设置分类">
                <div class="config-nav-scroll">
                <button
                  type="button"
                  class="config-nav-btn is-active"
                  data-tab="player"
                  aria-pressed="true"
                  aria-label="玩家"
                >
                  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                    />
                  </svg>
                </button>
                <button
                  type="button"
                  class="config-nav-btn"
                  data-tab="scene"
                  aria-pressed="false"
                  aria-label="场景"
                >
                  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM10 5.47l4 1.4v11.66l-4-1.4V5.47z"
                    />
                  </svg>
                </button>
                <button
                  type="button"
                  class="config-nav-btn"
                  data-tab="skin"
                  aria-pressed="false"
                  id="config-tab-skin"
                  aria-label="皮肤"
                >
                  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-3.87-.78-5.25-2.05.47-.74 1.26-1.23 2.16-1.23h6.18c.9 0 1.69.49 2.16 1.23A8.003 8.003 0 0112 20z"
                    />
                  </svg>
                </button>
                <button
                  type="button"
                  class="config-nav-btn"
                  data-tab="showcase"
                  aria-pressed="false"
                  aria-label="橱窗"
                >
                  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M21 9V7l-2-2H5L3 7v2h18zm0 2H3v10h18V11zM7 13h2v5H7v-5zm4 0h2v5h-2v-5z"
                    />
                  </svg>
                </button>
                <button
                  type="button"
                  class="config-nav-btn"
                  data-tab="anim"
                  aria-pressed="false"
                  aria-label="动画"
                >
                  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"
                    />
                  </svg>
                </button>
                <button
                  type="button"
                  class="config-nav-btn"
                  data-tab="controls"
                  aria-pressed="false"
                  aria-label="操作"
                >
                  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"
                    />
                  </svg>
                </button>
                <button
                  type="button"
                  class="config-nav-btn"
                  data-tab="skills"
                  aria-pressed="false"
                  aria-label="技能"
                >
                  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M12 2l2.4 7.4H22l-6 4.6 2.3 7-6.3-4.6L5.7 21l2.3-7-6-4.6h7.6L12 2z"
                    />
                  </svg>
                </button>
                <button
                  type="button"
                  class="config-nav-btn"
                  data-tab="effects"
                  aria-pressed="false"
                  aria-label="特效"
                >
                  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M12 2l1.2 4.2L17.5 7l-4.3 1.2L12 12.5l-1.2-4.3L6.5 7l4.3-.8L12 2zm7 7l.8 2.8L22.5 13l-2.7.8L19 16.5l-.8-2.7L15.5 13l2.7-.2L19 9zM5 13l.9 3.1L9 17l-3.1.9L5 21l-.9-3.1L1 17l3.1-.9L5 13z"
                    />
                  </svg>
                </button>
                <button
                  type="button"
                  class="config-nav-btn"
                  data-tab="settings"
                  aria-pressed="false"
                  aria-label="设置"
                >
                  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"
                    />
                  </svg>
                </button>
                </div>
              </nav>
              <div class="config-body">
                <div id="config-pane-player" class="config-pane" data-pane="player">
                  <div id="player-info-panel"></div>
                </div>
                <div id="config-pane-scene" class="config-pane" data-pane="scene" hidden>
                  <div id="scene-panel" class="config-section-panel"></div>
                </div>
                <div id="config-pane-skin" class="config-pane" data-pane="skin" hidden>
                  <div id="traits-panel" class="config-section-panel"></div>
                </div>
                <div id="config-pane-showcase" class="config-pane" data-pane="showcase" hidden>
                  <div id="showcase-panel" class="config-section-panel"></div>
                </div>
                <div id="config-pane-anim" class="config-pane" data-pane="anim" hidden>
                  <div id="anim-panel" class="config-section-panel"></div>
                </div>
                <div id="config-pane-controls" class="config-pane" data-pane="controls" hidden>
                  <p class="config-section-title">操作指导</p>
                  <div id="hint" class="controls-guide" aria-live="polite"></div>
                </div>
                <div id="config-pane-skills" class="config-pane" data-pane="skills" hidden>
                  <p class="config-section-title">技能</p>
                  <div id="skills-panel"></div>
                </div>
                <div id="config-pane-effects" class="config-pane" data-pane="effects" hidden>
                  <div id="effects-panel" class="config-section-panel"></div>
                </div>
                <div id="config-pane-settings" class="config-pane" data-pane="settings" hidden>
                  <p class="config-section-title">设置</p>
                  <div id="settings-panel"></div>
                </div>
              </div>
            </div>
            <div class="showcase-viewport" id="showcase-viewport" aria-hidden="true">
              <canvas id="showcase-canvas" aria-label="橱窗预览"></canvas>
              <canvas id="anim-canvas" hidden aria-label="动画预览"></canvas>
              <canvas id="effects-canvas" hidden aria-label="特效预览"></canvas>
              <p id="anim-preview-status" class="anim-preview-status" hidden></p>
              <p id="effects-preview-status" class="anim-preview-status" hidden></p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
