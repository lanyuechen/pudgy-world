<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pudgy World</title>
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <div id="loading">
        <div class="panel">
          <p class="title">Pudgy World</p>
          <p class="status" id="loading-status">Loading…</p>
          <div class="bar"><div id="loading-bar"></div></div>
        </div>
      </div>
      <label id="scene-switcher" for="scene-select">
        <span class="label">Scene</span>
        <select id="scene-select" aria-label="Select scene"></select>
      </label>
      <div id="hint">LMB drag: orbit · RMB / wheel: pan / zoom · Space: reset</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
